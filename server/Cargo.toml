[package]
name = "zone-server"
default-run = "zone-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"

[dependencies]
anyhow = "1"
axum = "0.8"
parry3d = "=0.31.1"
rusqlite = { version = "=0.41.1", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
str0m = { version = "=0.24.1", default-features = false, features = ["rust-crypto"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(unix)'.dependencies]
socket2 = "0.6"

[build-dependencies]
cc = "=1.11.1"

[profile.release]
lto = "thin"
codegen-units = 1
