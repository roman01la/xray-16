[package]
name = "zone-prediction"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
[lib]
crate-type = ["cdylib", "rlib"]
[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
parry3d = "=0.31.1"
[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
