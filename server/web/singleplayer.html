<!doctype html>
<html lang="en" class="game-only">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Play S.T.A.L.K.E.R.: Call of Pripyat in your browser. Single-player, with game data loaded as needed and saves kept on your device.">
<meta name="theme-color" content="#10110e">
<link rel="icon" href="data:,">
<title>S.T.A.L.K.E.R. — Call of Pripyat</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#e9e6db;font-family:system-ui,sans-serif}#canvas{position:fixed;inset:0;display:block;margin:auto;width:min(100dvw,calc(100dvh * var(--game-aspect,1.7777777778)));height:min(100dvh,calc(100dvw / var(--game-aspect,1.7777777778)));outline:none}#boot{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 35%,#272b20,#10110e 65%);padding:24px}#boot[hidden]{display:none}.panel{text-align:center;max-width:520px}.eyebrow{color:#afa68b;font:11px ui-monospace,monospace;letter-spacing:.3em;text-transform:uppercase}h1{font-size:clamp(28px,6vw,48px);font-weight:650;letter-spacing:.09em;margin:18px 0 8px}.subtitle{font-size:14px;letter-spacing:.3em;text-transform:uppercase;color:#bcbba9}.rule{width:64px;height:2px;background:#a39a69;margin:36px auto 24px}#boot-status{line-height:1.6;color:#d1cfbf;font-size:14px}.note{color:#918e7f;font-size:12px;line-height:1.7;margin-top:28px}button{font:inherit;padding:10px 18px;border:1px solid #a39a69;background:transparent;color:#e9e6db;cursor:pointer;margin-top:12px}button:focus-visible{outline:2px solid #e9e6db;outline-offset:4px}body>:not(#canvas):not(#boot):not(#browser-diagnostics){display:none!important}
#load-progress{display:block;width:100%;height:6px;margin:20px 0 10px;accent-color:#b8ab7d;border:0;background:#36392d}#load-detail{font:12px ui-monospace,monospace;color:#bcbba9;min-height:2.5em;line-height:1.7}#boot{pointer-events:none}#retry{pointer-events:auto}
#browser-diagnostics{position:fixed;z-index:3;bottom:12px;left:12px;margin:0;max-width:calc(100% - 24px);padding:8px 12px;background:#111e;color:#e9e6db;font:12px/1.4 ui-monospace,monospace;white-space:pre-wrap;pointer-events:none}
</style>
<canvas id="canvas" tabindex="0" width="1280" height="720" aria-label="Call of Pripyat game"></canvas>
<section id="boot" aria-label="Starting the game"><div class="panel"><div class="eyebrow">Single player · Browser edition</div><h1>S.T.A.L.K.E.R.</h1><div class="subtitle">Call of Pripyat</div><div class="rule"></div><p id="boot-status" role="status" aria-live="polite">Preparing the game…</p><progress id="load-progress" aria-label="Loading progress"></progress><p id="load-detail" aria-live="polite">Starting the engine…</p><button id="retry" hidden>Try again</button><p class="note">Game data loads as needed. The first launch may take a few minutes.<br>Your single-player saves stay in this browser.<br>Escape opens the game menu. If it first releases the mouse, press it again.</p></div></section>
<pre id="browser-diagnostics" aria-label="Rendering diagnostics" hidden></pre>
<div id="toolbar" hidden><button id="pick"></button><select id="game"></select><progress id="progress" value="0" max="1" hidden></progress><span id="ingest-status"></span><input id="extra-args" type="text"><button id="launch" disabled></button><button id="restart"></button><div id="status"></div><pre id="log"></pre></div>
<script type="module" src="./singleplayer-ui.mjs"></script>
</html>
