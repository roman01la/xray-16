# Deploy using server/tools/stage-fly.py; see server/deploy/FLY.md.
app = "roman-stalker-wan"
primary_region = "fra"
kill_signal = "SIGTERM"
kill_timeout = 25

[build]
  dockerfile = "Dockerfile.fly"
[deploy]
  strategy = "immediate"
[env]
  ZONE_SINGLEPLAYER = "1"
  ZONE_ASSET_ORIGIN = "https://roman-stalker-assets.t3.tigrisfiles.io"
  ZONE_ORIGIN = "https://stalker-online.xyz"
  # ZONE_DEV_TOKEN and ZONE_ANALYTICS_PASSWORD remain Fly secrets.

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1
  [[http_service.checks]]
    grace_period = "60s"
    interval = "15s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[[mounts]]
  source = "zone_data"
  destination = "/data"

# Single-player assets/CDN gateway and SQLite analytics only.
[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"
