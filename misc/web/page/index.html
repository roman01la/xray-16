<!doctype html>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<title>OpenXRay Web</title>
<script>
  const viewParams = new URLSearchParams(location.search);
  if (viewParams.get('debug') !== '1' && viewParams.get('autostart') !== '0')
    document.documentElement.classList.add('game-only');
</script>
<style>
  body { margin: 0; background: #0b0b0d; color: #ccc; font: 13px/1.4 ui-monospace, monospace; display: flex; flex-direction: column; height: 100vh; }
  #toolbar { display: flex; gap: 8px; align-items: center; padding: 6px 10px; background: #1a1a1f; flex-wrap: wrap; }
  #toolbar input[type=text] { width: 260px; background: #222; color: #ddd; border: 1px solid #444; padding: 3px 6px; }
  #toolbar select { background: #222; color: #ddd; border: 1px solid #444; padding: 3px 6px; }
  button { background: #2d2d36; color: #eee; border: 1px solid #555; padding: 4px 10px; cursor: pointer; }
  dialog { background: #202126; color: #eee; max-width: 520px; border: 1px solid #666; }
  button:disabled { opacity: .4; cursor: default; }
  progress { width: 220px; }
  #canvas { display: block; margin: 0 auto; width: min(1280px, 100%, calc(72dvh * var(--game-aspect, 1.7777777778))); height: auto; aspect-ratio: var(--game-aspect, 1.7777777778); background: #000; outline: none; }
  #log { flex: 1; overflow: auto; margin: 0; padding: 6px 10px; white-space: pre-wrap; color: #9a9; }
  #status { padding: 2px 10px; color: #888; }
  html.game-only, .game-only body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
  .game-only body > :not(#canvas) { display: none !important; }
  .game-only #canvas {
    position: fixed; inset: 0; margin: auto;
    width: min(100dvw, calc(100dvh * var(--game-aspect, 1.7777777778)));
    height: min(100dvh, calc(100dvw / var(--game-aspect, 1.7777777778)));
  }
</style>
<div id="toolbar">
  <button id="pick">Add game folder</button>
  <select id="game"></select>
  <progress id="progress" value="0" max="1" hidden></progress>
  <span id="ingest-status">checking game files...</span>
  <input type="text" id="extra-args" placeholder="extra engine args">
  <button id="launch" disabled>Launch</button>
  <button id="restart">Restart</button>
</div>
<canvas id="canvas" tabindex="0" width="1280" height="720"></canvas>
<div id="status"></div>
<pre id="log"></pre>
<script type="module" src="./main.js"></script>
